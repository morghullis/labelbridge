# Prueba de punta a punta de la actualización automática con el código actual, en Windows real.
# Compila el instalador de este commit y comprueba que una app ya instalada se actualiza y se vuelve a abrir:
#   D) con el actualizador de la versión instalada (la que tiene el usuario hoy)
#   E) con el actualizador nuevo
#   F) con el actualizador nuevo cuando la app tarda en cerrarse
#   G) cuando estaba instalada «para todos los usuarios» (esa copia se quita y queda solo para el usuario)
#   H) una instalación nueva queda solo para el usuario (sin pedir administrador)
name: Update end-to-end

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: "Versión instalada desde la que se actualiza"
        default: "1.3.0"
      cases:
        description: "Casos a probar (D E F G H)"
        default: "DEFGH"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      FROM_VERSION: ${{ inputs.from_version }}
      APPKEY: HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8B5C6F1E-3C2A-4E7B-9C1D-2F4A6B8C0D1E}_is1
      ADMINKEY: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{8B5C6F1E-3C2A-4E7B-9C1D-2F4A6B8C0D1E}_is1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Instalador de este commit
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # un comando que falla detiene el paso
          python packaging/make_icon.py
          python packaging/make_guide_images.py
          python packaging/make_guide_images.py --lang en
          python packaging/make_installer_images.py  # las imágenes de la marca que pide installer.iss
          python -m PyInstaller packaging/labelbridge.spec --noconfirm --clean
          choco install innosetup -y --no-progress
          $version = python -c "import labelbridge; print(labelbridge.__version__)"
          "NEW_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
          Get-ChildItem dist\installer

      - name: Versión instalada de partida y su código
        shell: pwsh
        run: |
          gh release download "v$env:FROM_VERSION" -p "*.exe" -D old
          git worktree add old-src "v$env:FROM_VERSION"

      - name: "Comprobación: PowerShell con y sin DETACHED_PROCESS"
        shell: pwsh
        run: |
          python -c "import subprocess; c=lambda f: ['powershell.exe','-NoProfile','-NonInteractive','-WindowStyle','Hidden','-Command','Set-Content -Path ' + f + ' -Value ok']; subprocess.Popen(c('detached.txt'), creationflags=0x8|0x200|0x08000000, close_fds=True); subprocess.Popen(c('nowindow.txt'), creationflags=0x200|0x08000000, close_fds=True)"
          Start-Sleep 20
          "Con DETACHED_PROCESS (versiones ≤ 1.3.0): " + (Test-Path detached.txt)
          "Con CREATE_NO_WINDOW (versión nueva): " + (Test-Path nowindow.txt)

      - name: "D) Actualizador de la versión instalada → instalador nuevo"
        if: contains(inputs.cases, 'D')
        continue-on-error: true  # informativo: el actualizador de las versiones ≤ 1.3.0 no lanza el instalador
        shell: pwsh
        run: |
          function Install-Old {
            Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            (Start-Process (Get-ChildItem old\*.exe)[0].FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
            Start-Sleep 12
            Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
          }
          Install-Old
          "Antes: " + (Get-ItemProperty $env:APPKEY).DisplayVersion
          $setup = (Get-ChildItem dist\installer\*.exe)[0].FullName
          python devtools/diagnose_update.py $setup --src old-src --close-seconds 0
          Start-Sleep 75
          $after = (Get-ItemProperty $env:APPKEY).DisplayVersion
          $running = Get-Process LabelBridge -ErrorAction SilentlyContinue
          "Después: $after · app abierta: $([bool]$running)"
          if ($after -ne $env:NEW_VERSION) { throw "D: no se instaló la versión nueva" }
          if (-not $running) { throw "D: la app no se volvió a abrir" }

      - name: "E) Actualizador nuevo → instalador nuevo"
        if: always() && contains(inputs.cases, 'E')
        shell: pwsh
        run: |
          Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          (Start-Process (Get-ChildItem old\*.exe)[0].FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          Start-Sleep 12
          Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Join-Path (Get-ItemProperty $env:APPKEY).InstallLocation "LabelBridge.exe"
          $setup = (Get-ChildItem dist\installer\*.exe)[0].FullName
          python devtools/diagnose_update.py $setup --app $app --close-seconds 0
          Start-Sleep 75
          $after = (Get-ItemProperty $env:APPKEY).DisplayVersion
          $running = Get-Process LabelBridge -ErrorAction SilentlyContinue
          "Después: $after · app abierta: $([bool]$running)"
          $logs = Join-Path $env:LOCALAPPDATA "LabelBridge\logs"
          if (Test-Path "$logs\actualizacion.log") { Get-Content "$logs\actualizacion.log" -Tail 20 }
          if ($after -ne $env:NEW_VERSION) { throw "E: no se instaló la versión nueva" }
          if (-not $running) { throw "E: la app no se volvió a abrir" }
          if (-not (Test-Path "$logs\instalador.log")) { throw "E: falta el registro del instalador" }

      - name: "F) Actualizador nuevo con una app que tarda en cerrarse"
        if: always() && contains(inputs.cases, 'F')
        shell: pwsh
        run: |
          Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          (Start-Process (Get-ChildItem old\*.exe)[0].FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          Start-Sleep 12
          Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Join-Path (Get-ItemProperty $env:APPKEY).InstallLocation "LabelBridge.exe"
          $setup = (Get-ChildItem dist\installer\*.exe)[0].FullName
          $slow = Start-Process python -ArgumentList 'devtools/diagnose_update.py',"`"$setup`"",'--app',"`"$app`"",'--close-seconds','150' -PassThru
          Start-Sleep 200
          $after = (Get-ItemProperty $env:APPKEY).DisplayVersion
          $running = Get-Process LabelBridge -ErrorAction SilentlyContinue
          "Después: $after · app abierta: $([bool]$running)"
          $logs = Join-Path $env:LOCALAPPDATA "LabelBridge\logs"
          if (Test-Path "$logs\actualizacion.log") { Get-Content "$logs\actualizacion.log" -Tail 20 }
          $slow | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($after -ne $env:NEW_VERSION) { throw "F: no se instaló la versión nueva" }
          if (-not $running) { throw "F: la app no se volvió a abrir" }

      - name: "G) Instalada «para todos los usuarios» → pasa a «solo para el usuario»"
        if: always() && contains(inputs.cases, 'G')
        shell: pwsh
        run: |
          function Uninstall-Copy($key) {
            if (-not (Test-Path $key)) { return }
            Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            $unins = (Get-ItemProperty $key).UninstallString -replace '"', ''
            (Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
            Start-Sleep 5
          }
          Uninstall-Copy $env:APPKEY  # la copia por usuario de las pruebas anteriores
          if (Test-Path $env:APPKEY) { throw "G: no se pudo desinstalar la copia por usuario" }
          (Start-Process (Get-ChildItem old\*.exe)[0].FullName -ArgumentList '/ALLUSERS','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          Start-Sleep 12
          Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
          $before = Get-ItemProperty $env:ADMINKEY
          "Antes: $($before.DisplayVersion) en $($before.InstallLocation)"
          # Sin /ALLUSERS, como lo lanza el actualizador automático de la versión instalada.
          $setup = (Get-ChildItem dist\installer\*.exe)[0].FullName
          $log = Join-Path $env:RUNNER_TEMP "g-instalador.log"
          $started = Get-Date
          $proc = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=`"$log`"" -PassThru
          $proc.WaitForExit()
          "El instalador terminó (código $($proc.ExitCode)) en $([int]((Get-Date) - $started).TotalSeconds) s"
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern 'para todos|copia|InitializeSetup|Installation process succeeded|Exit code' }
          Start-Sleep 10
          $user = Get-ItemProperty $env:APPKEY -ErrorAction SilentlyContinue
          "Después: para todos $(Test-Path $env:ADMINKEY) · solo para el usuario $($user.DisplayVersion) en $($user.InstallLocation)"
          if (Test-Path $env:ADMINKEY) { throw "G: sigue la copia para todos los usuarios" }
          if ($user.DisplayVersion -ne $env:NEW_VERSION) { throw "G: no quedó la versión nueva solo para el usuario" }
          if (Test-Path 'C:\Program Files\LabelBridge\LabelBridge.exe') { throw "G: quedó el programa en Archivos de programa" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'LabelBridge'))) { throw "G: se perdió la carpeta de datos" }
          Uninstall-Copy $env:APPKEY

      - name: "H) Instalación nueva: solo para el usuario, sin pedir administrador"
        if: always() && contains(inputs.cases, 'H')
        shell: pwsh
        run: |
          Get-Process LabelBridge -ErrorAction SilentlyContinue | Stop-Process -Force
          $setup = (Get-ChildItem dist\installer\*.exe)[0].FullName
          (Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          Start-Sleep 12
          "Por usuario: $(Test-Path $env:APPKEY) · para todos: $(Test-Path $env:ADMINKEY)"
          if (-not (Test-Path $env:APPKEY)) { throw "H: no quedó instalada para el usuario" }
          if (Test-Path $env:ADMINKEY) { throw "H: quedó instalada para todos los usuarios" }
          if ((Get-ItemProperty $env:APPKEY).DisplayVersion -ne $env:NEW_VERSION) { throw "H: versión equivocada" }
