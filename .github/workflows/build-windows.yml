# Compila los instaladores en GitHub: Windows (.exe) y Mac con Apple Silicon (.dmg), sin necesitar esos equipos.
# Se ejecuta al crear un tag vX.Y.Z o manualmente desde la pestaña Actions.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Dos tags seguidos no publican a la vez (la página de descargas se reemplaza entera en cada publicación).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"  # la consola de Windows (cp1252) no imprime ✓ ni ·: los scripts fallaban a mitad
      # Qt sin pantalla (offscreen) no lee las letras de Windows: sin esto mide y dibuja cada letra como una caja
      # (las pruebas de ancho fallaban y las capturas de la Guía del instalador salían con cajas).
      QT_QPA_FONTDIR: C:\Windows\Fonts
    permissions:
      contents: write  # solo para el Release del tag
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: El tag coincide con la versión de la app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = python -c "import labelbridge; print(labelbridge.__version__)"
          if ("v$version" -ne $env:TAG) { throw "El tag $env:TAG no coincide con la versión de la app ($version)" }

      - name: Instalar dependencias
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # un comando que falla detiene el paso
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs

      - name: Ejecutable (PyInstaller)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # un comando que falla detiene el paso
          python packaging/make_icon.py
          python packaging/make_guide_images.py
          python packaging/make_guide_images.py --lang en
          python packaging/make_installer_images.py
          python -m PyInstaller packaging/labelbridge.spec --noconfirm --clean

      - name: Probar el ejecutable empaquetado
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $proc = Start-Process -FilePath "dist\LabelBridge\LabelBridge.exe" -ArgumentList "--self-test", "`"$report`"" -PassThru
          if (-not $proc.WaitForExit(600000)) { $proc.Kill(); throw "La autoprueba del .exe no terminó en 10 minutos" }
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No se generó el informe" }
          if ($proc.ExitCode -ne 0) { throw "La autoprueba del .exe falló (código $($proc.ExitCode))" }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # un comando que falla detiene el paso
          $version = python -c "import labelbridge; print(labelbridge.__version__)"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss

      - name: Publicar en Releases (solo al crear un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: "Windows: LabelBridge-Setup-*.exe · Mac con Apple Silicon: LabelBridge-*-mac.dmg. Ábrelo para instalar o actualizar (conserva tu configuración)."
        run: |
          $installer = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          # La compilación de Mac corre a la vez: el Release lo crea la primera que llega y las dos suben su archivo.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "LabelBridge $env:TAG" --notes $env:NOTES
            if ($LASTEXITCODE -ne 0) { gh release view $env:TAG *> $null }
            if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el Release $env:TAG" }
          }
          gh release upload $env:TAG $installer --clobber
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar el Release $env:TAG" }

      - uses: actions/upload-artifact@v4
        with:
          name: LabelBridge-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

  build-mac:
    name: Mac (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # con -e y pipefail: un comando que falla detiene el paso
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: write  # solo para el Release del tag
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: El tag coincide con la versión de la app
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import labelbridge; print(labelbridge.__version__)")
          if [ "v$version" != "$TAG" ]; then echo "El tag $TAG no coincide con la versión de la app ($version)"; exit 1; fi

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs

      - name: App (PyInstaller)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_icon.py
          python packaging/make_guide_images.py
          python packaging/make_guide_images.py --lang en
          python -m PyInstaller packaging/labelbridge.spec --noconfirm --clean

      - name: Probar la app empaquetada
        run: python packaging/run_selftest.py dist/LabelBridge.app/Contents/MacOS/LabelBridge

      - name: Certificado propio de LabelBridge (las actualizaciones no vuelven a pedir permisos)
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::warning::Falta el secreto MAC_CERT_P12: se firma ad hoc y cada actualización volverá a pedir permisos en la Mac"
            exit 0
          fi
          keychain="$RUNNER_TEMP/labelbridge-firma.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/firma.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/firma.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$RUNNER_TEMP/firma.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -p codesigning "$keychain" | awk '/"LabelBridge"/ { print $2; exit }')
          if [ -z "$identity" ]; then echo "El secreto MAC_CERT_P12 no trae el certificado LabelBridge"; exit 1; fi
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Imagen de disco (.dmg)
        run: python packaging/make_dmg.py

      - name: Publicar en Releases (solo al crear un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: "Windows: LabelBridge-Setup-*.exe · Mac con Apple Silicon: LabelBridge-*-mac.dmg. Ábrelo para instalar o actualizar (conserva tu configuración)."
        run: |
          # La compilación de Windows corre a la vez: el Release lo crea la primera que llega y las dos suben su archivo.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "LabelBridge $TAG" --notes "$NOTES" || gh release view "$TAG" > /dev/null
          fi
          gh release upload "$TAG" dist/installer/*.dmg --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: LabelBridge-Mac
          path: dist/installer/*.dmg
          if-no-files-found: error

  publish-updates:
    name: Publicar en la página de descargas
    needs: [build, build-mac]
    # Si solo falla la de Mac, Windows se publica igual (la página ofrece Mac cuando su compilación sale bien).
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: LabelBridge-Setup
          path: dist/installer

      - uses: actions/download-artifact@v4
        if: needs.build-mac.result == 'success'
        with:
          name: LabelBridge-Mac
          path: dist/installer

      - name: Publicar versión (las apps instaladas la detectan solas) y las anteriores desde la 1.5
        env:
          UPDATES_DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/publish_update.py --push --fetch-archive
