# Compila el instalador de Windows en GitHub (no necesitas un PC con Windows para generarlo).
# Se ejecuta al crear un tag vX.Y.Z o manualmente desde la pestaña Actions.
name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Dos tags seguidos no publican a la vez (la página de descargas se reemplaza entera en cada publicación).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"  # la consola de Windows (cp1252) no imprime ✓ ni ·: los scripts fallaban a mitad
    permissions:
      contents: write  # solo para el Release del tag
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: El tag coincide con la versión de la app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = python -c "import labelbridge; print(labelbridge.__version__)"
          if ("v$version" -ne $env:TAG) { throw "El tag $env:TAG no coincide con la versión de la app ($version)" }

      - name: Instalar dependencias
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # un comando que falla detiene el paso
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs

      - name: Ejecutable (PyInstaller)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # un comando que falla detiene el paso
          python packaging/make_icon.py
          python packaging/make_guide_images.py
          python packaging/make_guide_images.py --lang en
          python packaging/make_installer_images.py
          python -m PyInstaller packaging/labelbridge.spec --noconfirm --clean

      - name: Probar el ejecutable empaquetado
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $proc = Start-Process -FilePath "dist\LabelBridge\LabelBridge.exe" -ArgumentList "--self-test", "`"$report`"" -PassThru
          if (-not $proc.WaitForExit(600000)) { $proc.Kill(); throw "La autoprueba del .exe no terminó en 10 minutos" }
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No se generó el informe" }
          if ($proc.ExitCode -ne 0) { throw "La autoprueba del .exe falló (código $($proc.ExitCode))" }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # un comando que falla detiene el paso
          $version = python -c "import labelbridge; print(labelbridge.__version__)"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss

      - name: Publicar en Releases (solo al crear un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $installer = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          # Si se vuelve a ejecutar el workflow, el Release ya existe: se reemplaza el instalador.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $installer --clobber
          } else {
            gh release create $env:TAG $installer --title "LabelBridge $env:TAG" --notes "Instalador para Windows: descarga el .exe y ábrelo para instalar o actualizar (conserva tu configuración)."
          }
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar el Release $env:TAG" }

      - uses: actions/upload-artifact@v4
        with:
          name: LabelBridge-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

  publish-updates:
    name: Publicar en la página de descargas
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: LabelBridge-Setup
          path: dist/installer

      - name: Publicar versión (las apps instaladas la detectan solas) y las anteriores desde la 1.5
        env:
          UPDATES_DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/publish_update.py --push --fetch-archive
